<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>鼎鑫實金回收價格 · 全面漲跌</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Consolas', 'Monaco', 'Microsoft JhengHei', monospace;
  }
  body {
    background: #0c0c0c;
    color: #f5f5f5;
    padding: 15px 0;
    line-height: 1.6;
    font-size: clamp(16px, 2vw, 64px);
    width: 100vw;
    min-height: 100vh;
    overflow-x: hidden;
    margin: 0 !important;
  }
  .container {
    width: min(98vw, 1600px) !important;
    margin: 0 auto !important;
    padding: 0 clamp(10px, 1.5vw, 15px) !important;
  }
  header {
    margin-bottom: clamp(20px, 4vw, 62.5px);
    padding: clamp(20px, 4vw, 50px) clamp(15px, 2vw, 25px) clamp(15px, 2vw, 30px) clamp(15px, 2vw, 25px);
    background: #121212;
    color: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(200, 180, 80, 0.2), 0 0 20px rgba(255, 215, 0, 0.1) inset;
    border: 4px solid #c8b450;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      to right,
      rgba(255, 215, 0, 0) 0%,
      rgba(255, 215, 0, 0.3) 50%,
      rgba(255, 215, 0, 0) 100%
    );
    transform: skewX(-25deg);
    animation: shine 6s infinite linear;
  }
  @keyframes shine {
    0% { left: -75%; }
    100% { left: 150%; }
  }
  .header-flex-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: clamp(20px,3vw,40px);
    flex-wrap: wrap;
  }
  .header-left-logo {
    display: flex;
    align-items: center;
    gap: clamp(12px,2vw,24px);
  }
  .header-title-text {
    display: flex;
    flex-direction: column;
  }
  .main-title-top {
    font-size: clamp(2rem, 6vw, 12rem);
    color: #ffffff;
    text-shadow: 0 0 25px rgba(255, 255, 255, 0.4), 0 2px 4px rgba(0, 0, 0, 0.5);
    letter-spacing: 3px;
    line-height: 1.1;
  }
  .main-title-bottom {
    font-size: clamp(2rem, 6vw, 12rem);
    color: #ffffff;
    text-shadow: 0 0 25px rgba(255, 255, 255, 0.4), 0 2px 4px rgba(0, 0, 0, 0.5);
    letter-spacing: 3px;
    line-height: 1.1;
  }
  .header-right-qrcode {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .qrcode-img {
    width: clamp(120px,12vw,540px);
    max-width: 100%;
    margin-bottom: 8px;
  }
  .qrcode-tip {
    background: #0066ff;
    color: #fff;
    font-size: clamp(0.8rem,1.2vw,90%);
    padding: 4px 12px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .hotline-full-line {
    width: 100%;
    margin: clamp(8px,2vw,20px) 0;
    font-size: clamp(1.2rem,3vw,200%);
    color: #25d366;
    font-weight: 800;
    text-shadow: 0 0 15px rgba(37, 211, 102, 0.5), 0 0 10px rgba(0, 0, 0, 0.5);
    letter-spacing: 3px;
    line-height: 1.3;
    font-family: 'Consolas', 'Monaco', monospace;
  }
  .hotline-full-line i {
    margin-right: 20px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .timestamp-full-line {
    width: 100%;
    text-align: right;
    font-size: clamp(0.8rem,1.5vw,75%);
    color: #ff3333;
    font-weight: bold;
    margin-top: 10px;
    text-shadow: 0 0 10px rgba(255,50,50,0.4);
    font-family: 'Consolas', 'Monaco', monospace;
  }
  .price-table-container {
    background: #121212;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4), 0 0 30px rgba(255, 215, 0, 0.1) inset;
    margin-bottom: clamp(20px,4vw,62.5px);
    border: 4px solid #333;
    padding: 0;
    width: 100%;
    position: relative;
  }
  .price-table {
    width: 100%;
    border-collapse: collapse;
  }
  .price-table thead tr {
    background: #1f1f1f;
  }
  .price-table th {
    padding: clamp(15px,2vw,30px) clamp(8px,1.5vw,20px);
    font-size: clamp(2rem,5vw,9rem);
    font-weight: 800;
    color: #fff;
    text-align: center;
    border-bottom: 6px solid #ff3333;
  }
  .price-table tbody tr:nth-child(odd) {
    background: #171717;
  }
  .price-table tbody tr:nth-child(even) {
    background: #1c1c1c;
  }
  .price-table td {
    padding: clamp(18px,3vw,40px) clamp(6px,1vw,20px);
    text-align: center;
    border-bottom: 2px solid #282828;
  }
  .col-name {
    font-size: clamp(2rem,4.5vw,8.5rem);
    font-weight: 700;
    color: #ffd000;
    text-shadow: 0 3px 6px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255,208,0,0.3);
    letter-spacing: 2px;
  }
  .price-val {
    font-weight: 700;
    font-size: clamp(1.8rem,4vw,calc(19.8rem * 0.65));
    color: #ffd700;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.7), 0 3px 6px rgba(0, 0, 0, 0.5);
    transition: all 0.5s ease;
    display: inline-block;
  }
  .price-val.up {
    animation: priceUp 0.5s ease-in-out;
  }
  .price-val.down {
    animation: priceDown 0.5s ease-in-out;
  }
  @keyframes priceUp {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); color: #ff6b6b; }
    100% { transform: scale(1); }
  }
  @keyframes priceDown {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); color: #4ecdc4; }
    100% { transform: scale(1); }
  }
  .empty-tip {
    font-size: clamp(1rem,2vw,calc(6rem * 0.65));
    color: #888;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
  }
  .banner-blue-block {
    width: 100%;
    background: #0a1428;
    border-radius: 15px;
    padding: clamp(15px,3vw,35px) clamp(10px,2vw,20px);
    margin: clamp(20px,4vw,62.5px) 0 20px;
    text-align: center;
    border: 3px solid #193366;
  }
  .banner-top-text {
    font-size: clamp(1.8rem,5vw,6rem);
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 0 18px rgba(255, 215, 0, 0.6), 0 4px 8px #000;
    margin-bottom: 20px;
    letter-spacing: 4px;
  }
  .banner-bottom-text {
    font-size: clamp(1rem,2.5vw,2.8rem);
    font-weight: bold;
    color: #ffffff;
    line-height: 1.8;
  }
  .note-footer {
    width: 100%;
    background: #000000;
    border: 4px solid #333;
    border-radius: 15px;
    padding: clamp(12px,2vw,20px) clamp(15px,2vw,25px);
    margin-top: 20px;
    text-align: right;
    font-size: clamp(1rem,2vw,150%);
    line-height: 1.6;
  }
  .note-normal {
    color: #ffffff;
  }
  .note-gold {
    color: #ffd000;
    font-weight: bold;
  }
  @media (max-width: 768px) {
    .header-flex-wrap {
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .header-left-logo {
      flex-direction: column;
      text-align: center;
    }
    .hotline-full-line {
      text-align: center;
    }
    .hotline-full-line i { font-size: 1.6rem; margin-right: 6px; }
  }
</style>

</head>

<body>

<div class="container">

  <header>
    <div class="header-flex-wrap">
      <!-- 移除LOGO圖片 -->
      <div class="header-left-logo">
        <div class="header-title-text">
          <div class="main-title-top">鼎鑫實金</div>
          <div class="main-title-bottom">回收行情</div>
        </div>
      </div>
      <div class="header-right-qrcode">
        <!-- 替換QR Code連結 -->
        <img src="https://i.ibb.co/MDdnBrLb/qrcode-www-dsgolds-com.png" alt="查詢二維碼" class="qrcode-img">
        <div class="qrcode-tip">實時金價，掃碼即看</div>
      </div>
    </div>

    <div class="hotline-full-line">
      <i class="fab fa-whatsapp"></i>上環查詢電話: 5396 2703
    </div>
    <div class="hotline-full-line">
      <i class="fab fa-whatsapp"></i>分店查詢電話: 5428 7123
    </div>

    <div class="timestamp-full-line">更新時間: <span id="ut">初始化中...</span></div>
  </header>

  <div class="price-table-container">
    <table class="price-table">
      <thead>
        <tr>
          <th>商品<br>(純度9999)</th>
          <th>回購價<br>(每兩)</th>
          <th>銷售價<br>(每兩)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-name">黃金AU</td>
          <td><div class="price-val" id="buy-au">--</div></td>
          <td><div class="price-val" id="sell-au">--</div></td>
        </tr>
        <tr>
          <td class="col-name">白銀AG</td>
          <td><div class="price-val" id="buy-ag">--</div></td>
          <td><div class="price-val" id="sell-ag">--</div></td>
        </tr>
        <tr>
          <td class="col-name">鉑金PT</td>
          <td><div class="price-val" id="buy-pt">--</div></td>
          <td><div class="empty-tip">暫未開售</div></td>
        </tr>
      </tbody>
    </table>
  </div>

<div class="banner-blue-block">
    <div class="banner-top-text">💵免費報價💵</div>
    <div class="banner-bottom-text">
        ✅收足金✅K金✅金銀條✅金銀幣✅銀器<br>
        ✅低K首飾✅舊金✅壞金✅帶石金飾
    </div>
</div>

  <div class="note-footer">
    <div class="note-normal">
      *最終報價需按照實際純度計算
    </div>
    <div class="note-gold">*免火耗 免佣金 免手續費</div>
  </div>
</div>

<script>

(function(){

    var d = document, ut = d.getElementById('ut');

    var fmt = function(n){ return n<10?'0'+n:n; };

    setInterval(function(){ 

        var t = new Date(); 

        ut.textContent = t.getFullYear() + '年' + fmt(t.getMonth()+1) + '月' + fmt(t.getDate()) + '日 ' + fmt(t.getHours()) + ':' + fmt(t.getMinutes()) + ':' + fmt(t.getSeconds()); 

    }, 1000);

    

    var M = {

        au:{ c:'AUX', h:'sh-au', r:'sr-au' },

        ag:{ c:'AGX', h:'sh-ag', r:'sr-ag' },

        pt:{ c:'PTX', h:'sh-pt', r:'sr-pt' }

    };

    var ws, tm;

    var rand = function(l){ 

        var c = 'abcdefghijklmnopqrstuvwxyz0123456789', r = ''; 

        for(var i=0; i<l; i++) r += c.charAt(Math.floor(Math.random()*c.length)); 

        return r;

    };

    

    var lastValues = {};

    function conn(){

        var svr = Math.floor(Math.random()*1000).toString().padStart(3,'0');

        ws = new WebSocket('wss://chart-data.bullionvault.com/price_feed/'+svr+'/'+rand(8)+'/websocket');

        ws.onopen = function(){};

        ws.onmessage = function(e){

            var dat = e.data;

            if(dat === 'o'){

                ws.send('["CONNECT\\naccept-version:1.2,1.1,1.0\\nheart-beat:10000,10000\\n\\n\\u0000"]');

            } else if(dat.startsWith('a[')){

                try {

                    var arr = JSON.parse(dat.substring(1));

                    arr.forEach(proc);

                } catch(err){}

            }

        };

        ws.onclose = function(){ clearInterval(tm); setTimeout(conn, 5000); };

    }

    function proc(msg){

        if(msg.startsWith('CONNECTED')){

            for(var k in M) ws.send('["SUBSCRIBE\\nid:'+M[k].h+'\\ndestination:/t/'+M[k].c+'/USD/5\\n\\n\\u0000"]');

            tm = setInterval(function(){}, 10000);

        } else if(msg.startsWith('MESSAGE')){

            var p = msg.split('\n\n');

            if(p.length<2) return;

            var head = p[0], body = p[1].replace(/\u0000$/,'');

            var subId = '';

            var hl = head.split('\n');

            for(var i=0;i<hl.length;i++){ if(hl[i].indexOf('subscription:')===0) subId = hl[i].split(':')[1]; }

            

            var val = null;

            try {

                var j = JSON.parse(body);

                if(j.prices && Array.isArray(j.prices) && j.prices.length>0) val = j.prices[0].latestPrice;

                else if(j.price) val = j.price;

                else if(j.latestPrice) val = j.latestPrice;

            } catch(e){ return; }

            if(val !== null){

                for(var k in M){

                    if(subId === M[k].h){

                        upd(k, val);

                        ws.send('["UNSUBSCRIBE\\nid:'+M[k].h+'\\n\\n\\u0000"]');

                        ws.send('["SUBSCRIBE\\nid:'+M[k].r+'\\ndestination:/t/'+M[k].c+'/USD\\n\\n\\u0000"]');

                    } else if(subId === M[k].r){

                        upd(k, val);

                    }

                }

            }

        }

    }

    var fHkd = function(n){ return n.toLocaleString('zh-HK',{minimumFractionDigits:0,maximumFractionDigits:0}); };

    function upd(key, raw){

        var cp = parseFloat(raw);

        if(isNaN(cp)) return;

        

        var coefficient;

        switch(key) {

            case 'au': coefficient = 7.55; break;

            case 'ag': coefficient = 7; break;

            case 'pt': coefficient = 7.22; break;

            default: coefficient = 7.52;

        }

        

        var mp = cp / 32.15;

        var poz = mp * coefficient;

        var pg = poz / 31.1;

        var buyPrice = pg * 37.429;

        var sellPrice = 0;

        if(key === 'au') sellPrice = buyPrice + 2245;

        if(key === 'ag') sellPrice = buyPrice + 82;

        

        var buyEl = d.getElementById('buy-' + key);

        var oldBuyVal = lastValues.hasOwnProperty('buy-' + key) ? lastValues['buy-' + key] : null;

        var buyColor = '#ffd700';

        

        if(oldBuyVal !== null && buyPrice !== oldBuyVal) {

            if(buyPrice > oldBuyVal) {

                buyColor = 'rgba(255, 50, 50, 0.9)';

                buyEl.classList.add('up');

                setTimeout(() => buyEl.classList.remove('up'), 500);

            } else if(buyPrice < oldBuyVal) {

                buyColor = 'rgba(50, 200, 50, 0.9)';

                buyEl.classList.add('down');

                setTimeout(() => buyEl.classList.remove('down'), 500);

            }

        }

        

        buyEl.textContent = fHkd(buyPrice);

        buyEl.style.color = buyColor;

        lastValues['buy-' + key] = buyPrice;

        if(key === 'au' || key === 'ag'){

            var sellEl = d.getElementById('sell-' + key);

            var oldSellVal = lastValues.hasOwnProperty('sell-' + key) ? lastValues['sell-' + key] : null;

            var sellColor = '#ffd700';

            

            if(oldSellVal !== null && sellPrice !== oldSellVal) {

                if(sellPrice > oldSellVal) {

                    sellColor = 'rgba(255, 50, 50, 0.9)';

                    sellEl.classList.add('up');

                    setTimeout(() => sellEl.classList.remove('up'), 500);

                } else if(sellPrice < oldSellVal) {

                    sellColor = 'rgba(50, 200, 50, 0.9)';

                    sellEl.classList.add('down');

                    setTimeout(() => sellEl.classList.remove('down'), 500);

                }

            }

            

            sellEl.textContent = fHkd(sellPrice);

            sellEl.style.color = sellColor;

            lastValues['sell-' + key] = sellPrice;

        }

    }

    conn();

})();

</script>

</body>

</html>
